<header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(45,36,34,0.05)]">
  <div class="h-20 max-w-[1280px] mx-auto px-gutter flex items-center justify-between gap-space-md">

    <!-- Logo & Title -->
    <a class="flex items-center gap-space-sm group" routerLink="/home">
      <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform duration-300">
        <i class="fa-solid fa-utensils text-on-primary-container text-[18px]"></i>
      </div>
      <div class="flex flex-col">
        <span class="font-headline-sm text-headline-sm text-on-surface leading-tight tracking-tight">
          DaNang <span class="text-primary">Food Guide</span>
        </span>
        <span class="font-label-xs text-label-xs text-tertiary uppercase tracking-wider">Ẩm Thực Đà Nẵng</span>
      </div>
    </a>

    <!-- Navigation Menu -->
    <nav class="hidden xl:flex items-center gap-space-xs p-1 bg-surface-container-low/60 rounded-full">
      <a routerLink="/home"
         routerLinkActive="bg-surface-container text-primary font-title-md shadow-sm"
         [routerLinkActiveOptions]="{exact: true}"
         class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all duration-300">
        Khám phá
      </a>
      <a routerLink="/food-search"
         routerLinkActive="bg-surface-container text-primary font-title-md shadow-sm"
         class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all duration-300">
        Gợi ý cho tôi
      </a>
      <a routerLink="/map"
         routerLinkActive="bg-surface-container text-primary font-title-md shadow-sm"
         class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all duration-300">
        Bản đồ
      </a>
      <a routerLink="/itinerary"
         routerLinkActive="bg-surface-container text-primary font-title-md shadow-sm"
         class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all duration-300">
        Lộ trình
      </a>
      <a routerLink="/food-guide"
         routerLinkActive="bg-surface-container text-primary font-title-md shadow-sm"
         class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all duration-300">
        Cẩm nang
      </a>
    </nav>

    <!-- User Actions & Language Switcher -->
    <div class="flex items-center gap-space-sm">
      <!-- Language Switcher -->
      <div class="flex items-center bg-surface-container-low px-space-sm py-1 rounded-full text-label-md font-label-md">
        <button
          (click)="switchLanguage('VIE')"
          [ngClass]="currentLang === 'VIE' ? 'font-bold text-primary' : 'text-on-surface-variant'"
          class="px-space-xs py-0.5 rounded-full transition-colors"
          type="button">
          VIE
        </button>
        <span class="text-outline-variant px-0.5">/</span>
        <button
          (click)="switchLanguage('ENG')"
          [ngClass]="currentLang === 'ENG' ? 'font-bold text-primary' : 'text-on-surface-variant'"
          class="hover:text-on-surface px-space-xs py-0.5 rounded-full transition-colors"
          type="button">
          ENG
        </button>
      </div>

      <!-- Khối Control Flow mới của Angular (Thay cho *ngIf) -->
      @if (!isLoggedIn) {
        <a routerLink="/auth/login"
           class="cursor-pointer hidden sm:inline-flex items-center justify-center px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface hover:text-primary hover:bg-surface-container-low transition-colors">
          Đăng nhập
        </a>
        <a routerLink="/auth/signup" class="inline-flex items-center justify-center px-space-lg py-space-sm rounded-full font-label-lg text-label-lg bg-primary text-on-primary hover:bg-primary-container shadow-sm transition-all">
          Đăng ký
        </a>

      } @else {
        <!-- Trạng thái: ĐÃ đăng nhập (Hiển thị User Profile) -->
        <button aria-label="Thông báo" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors relative ml-2">
          <i class="fa-regular fa-bell text-[18px]"></i>
          <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-primary ring-2 ring-surface"></span>
        </button>

        <a routerLink="/saved-restaurants" class="flex items-center gap-3 p-1.5 pl-4 bg-surface-container-low hover:bg-surface-container-high rounded-full transition-all group ml-1" title="Danh sách quán đã lưu">
          <div class="hidden sm:flex flex-col text-right">
            <span class="font-label-lg text-label-lg text-on-surface leading-tight">{{ currentUser?.full_name || currentUser?.email || 'Tài khoản' }}</span>
            <span class="font-label-xs text-label-xs text-secondary flex items-center justify-end gap-1 font-bold">
              <i class="fa-solid fa-bookmark text-[11px]"></i> Quán đã lưu
            </span>
          </div>
          <span aria-hidden="true" class="w-9 h-9 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm ring-2 ring-surface group-hover:ring-primary/30 transition-all">
            <i class="fa-solid fa-user"></i>
          </span>
        </a>
        <button type="button" (click)="logout()" class="px-space-md py-space-sm rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors" title="Đăng xuất">
          Đăng xuất
        </button>
      }

    </div>
  </div>
</header>
